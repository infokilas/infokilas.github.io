---
layout: default
---
<article class="article-page">
<header class="article-header"><div class="eyebrow">{{ page.categories | first | default: 'Artikel' }}</div><h1>{{ page.title }}</h1><p class="article-meta">{{ page.date | date: '%d-%m-%Y' }} · {{ page.author | default: site.title }}</p></header>
{% if page.image %}<img class="article-hero" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" width="1200" height="675">{% endif %}
<div class="article-body">{{ content }}</div>
{% unless page.hide_buttons %}<div class="article-actions"><a class="archive-button" href="{{ '/arsip/' | relative_url }}">Lihat Artikel Lainnya</a></div>{% endunless %}
</article>
