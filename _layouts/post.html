---
layout: default
---
<article class="article-page">
<header class="article-header"><p class="eyebrow">{{ page.categories | first | default: 'Artikel' }}</p><h1>{{ page.title }}</h1><p class="article-meta">{{ page.date | date: '%d-%m-%Y' }} · {{ page.author | default: site.author }}</p></header>
{% if page.image %}<img class="article-hero" src="{{ page.image | relative_url }}" alt="{{ page.title | escape }}" width="1200" height="675">{% endif %}
<div class="article-body">{{ content }}</div>
{% unless page.hide_buttons %}<div class="article-actions"><a href="{{ '/' | relative_url }}">Kembali ke Beranda</a></div>{% endunless %}
</article>
