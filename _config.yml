title: INFOKILAS
description: Berita, teknologi, hiburan, dan gaya hidup.
url: https://infokilas.github.io
baseurl: ""
lang: id-ID
timezone: Asia/Jakarta
markdown: kramdown
permalink: /:title/
plugins:
