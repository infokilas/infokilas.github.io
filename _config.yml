title: "INFOKILAS"
description: "Informasi, teknologi, dan hiburan digital terkini."
url: "https://infokilas.github.io"
baseurl: ""
lang: id-ID
timezone: Asia/Jakarta
markdown: kramdown
permalink: /:title/
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: "Tim Redaksi INFOKILAS"
      hide_buttons: true
